title: "[Calibration] 1920x1080 100% Fullscreen - short description"
labels: [calibration]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your calibration with the community!

        **How to export:** open the panel -> Macro Calibrations -> **Export** -> attach the resulting `EndSol-calibration.json` to this post (or paste its contents below).

        Verified presets are added to the built-in calibration picker, where everyone can download them by resolution/scale/mode.
  - type: input
    id: resolution
    attributes:
      label: Display resolution
      description: Your Windows display resolution, e.g. 1920x1080
    validations:
      required: true
  - type: input
    id: scale
    attributes:
      label: Windows scaling
      description: Settings -> Display -> Scale, e.g. 100%, 125%, 150%
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Roblox window mode
      options:
        - Fullscreen
        - Windowed
        - Windowed fullscreen
    validations:
      required: true
  - type: textarea
    id: preset
    attributes:
      label: Exported calibration JSON
      description: Attach EndSol-calibration.json or paste its full contents
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything important (game tested, browser zoom, monitor specifics...)
    validations:
      required: false